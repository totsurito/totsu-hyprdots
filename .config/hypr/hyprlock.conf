# BACKGROUND
background {
    monitor =
    path = ~/.config/hypr/hyprlock.jpg
    blur_passes = 0
    vibrancy_darkness = 0.0
    blur_passes = 1
}

# GENERAL
general {
}

# GREETINGS
label {
    monitor =
    text = Welcome!
    color = rgba(225, 255, 255, 0.5)
    font_size = 50
    font_family = SF Pro Display Bold
    position = 0, 250
    halign = center
    valign = center
}

# Day, Date-Month
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"- %I:%M -")</span>"
    color = rgba(225, 255, 255, 0.5)
    font_size = 50
    font_family = SF Pro Display Bold
    position = 0, 150
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba(225, 255, 255, 0.5)
    font_size = 20
    font_family = SF Pro Display Bold
    position = 0, 90
    halign = center
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 300, 60
    color = rgba(0, 0, 0, 0.5)
    rounding = -1
    border_size = 0
    border_color = rgba(0, 0, 0, 0.5)
    rotate = 0
    xray = false
    position = 0, -80
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =     $USER
    color = rgba(225, 255, 255, 0.5)
    font_size = 18
    font_family = SF Pro Display Bold
    position = 0, -80
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(225, 255, 255, 0.5)
    inner_color = rgba(225, 255, 255, 0.5)
    font_color = rgba(0, 0, 0, 0.5)
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = <i>Enter Pass</i>
    hide_input = false
    position = 0, -160
    halign = center
    valign = center
}
